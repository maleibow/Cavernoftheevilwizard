<title>Cavern of the Evil Wizard</title>
<style>
:root{--bg:#000;--fg:#55ffff;--hi:#ff55ff;--wh:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--fg);font-family:"Courier New",Consolas,monospace}
#g{max-width:960px;margin:0 auto;padding:8px;display:flex;flex-direction:column;min-height:100vh}
#pic{width:100%;aspect-ratio:320/166;background:#000;object-fit:contain;image-rendering:pixelated;border:3px solid var(--hi);display:block}
#log{flex:1;min-height:160px;max-height:42vh;overflow-y:auto;padding:8px 4px;text-transform:uppercase;font-size:clamp(14px,2.4vw,19px);line-height:1.35}
#log p{margin:0 0 .5em}#log .you{color:var(--wh)}#log .bad{color:var(--hi)}#log .sys{color:#aaa}
#row{display:flex;gap:6px;align-items:center;font-size:clamp(16px,2.6vw,20px)}
#in{flex:1;background:#000;color:var(--wh);border:2px solid var(--fg);padding:8px;font:inherit;text-transform:uppercase;outline:none}
#bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button{background:#000;color:var(--fg);border:2px solid var(--fg);font:inherit;font-size:14px;padding:7px 11px;cursor:pointer}
button:hover,button:active{background:var(--fg);color:#000}

const show=n=>{if(pic.dataset.n!==n){pic.dataset.n=n;pic.src=IMG[n]}};
function rimg(){const r=S.room,f=S.f;
if(r=='tree')return f.bark?'3x':'3';
if(r=='forest')return '13-'+(f.bucket?1:0)+(f.mush?1:0);
if(r=='dwarf')return f.sleep?(has('sword')?'9zs':'9z'):'9';
if(r=='bird')return has('pod')?'5x':'5';
if(r=='fish')return f.dogGone?'7x':'7';
if(r=='bridge')return f.yeti?'4x':'4';
if(r=='tiger')return f.tiger?'8x':'8';
return ROOMS[r].img}
function say(t,c){const p=document.createElement('p');if(c)p.className=c;p.textContent=t;log.appendChild(p);log.scrollTop=log.scrollHeight}

const SONG={pick:'O4 l8 EG>ECDG',life:'O2 l8 t180 DEFGE<C>l4D',
die:'O2 T100 L4 F D L2 G L8 D C# L1 D',
win:'O3 T160 L2 F# L8 D- B- L2 B- L8 A- F# F# L2 F# L8 D- B- B- A- F# F# L2 E- D-',
intro:'O3 T140 L8 D B- G G D D A F F D D A F F C C E E F D B- G G'};
function mml(s){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let o=3,t=120,l=4,at=AC.currentTime+.05;
const N={C:0,D:2,E:4,F:5,G:7,A:9,B:11};const re=/([A-GNOTLP<>])([+#-]?)(\d*)/g;let m;s=s.toUpperCase().replace(/M[BFNLS]/g,'');
while(m=re.exec(s)){const c=m[1],a=m[2],n=+m[3];if(c=='O')o=n;else if(c=='T')t=n;else if(c=='L')l=n;else if(c=='<')o--;else if(c=='>')o++;
else{const d=240/t/(n||l)*(s[re.lastIndex]=='.'?1.5:1);let midi=null;
if(c=='N'){if(n>0)midi=n+11}else if(c!='P')midi=12*(o+1)+N[c]+(a=='-'?-1:a?1:0);
if(c=='N'){const d2=240/t/l;if(midi!=null)blip(midi,at,d2);at+=d2}else{if(midi!=null)blip(midi,at,d);at+=d}}}}catch(e){}}
function blip(m,t,d){const x=AC.createOscillator(),g=AC.createGain();x.type='square';x.frequency.value=440*2**((m-69)/12);
g.gain.setValueAtTime(.06,t);g.gain.setValueAtTime(0,t+d*.9);x.connect(g);g.connect(AC.destination);x.start(t);x.stop(t+d)}

function desc(){const r=S.room,f=S.f;
if(r=='fish')return !f.dogGone?"There is a fisherman and a very loud dog.":"A fisherman stands here.";
if(r=='bridge')return f.yeti?"A sturdy bridge crosses a roaring river. The yeti is busy with his pie.":"There is a yeti here, blocking the path. A river rushes below.";
if(r=='tiger')return f.tiger?"There is nothing of interest here.":"A tiger is going to attack you!";
if(r=='dwarf')return f.sleep?"The dwarf snores peacefully. The mouth of the cavern lies ahead.":"The dwarf blocks your way.";
if(r=='forest')return "You see "+(S.f.bucket?"":"a bucket and ")+(S.f.mush?"nothing else of use":"some mushrooms")+".";
if(r=='out'&&!1)return ROOMS.out.d;
return ROOMS[r].d}
const exitsTxt=()=>{const x=Object.keys(ROOMS[S.room].x);return x.length?"Exits: "+x.join(' '):''};

const SYN={TAKE:'GET',GRAB:'GET',PICK:'GET',EXAMINE:'LOOK',L:'LOOK',X:'LOOK',INSPECT:'LOOK',SEARCH:'LOOK',I:'INVENTORY',INV:'INVENTORY',
SPEAK:'TALK',CHAT:'TALK',PURCHASE:'BUY',TOSS:'THROW',HURL:'THROW',CONSUME:'EAT',OFFER:'GIVE',FEED:'GIVE',WALK:'GO',RUN:'GO',ENTER:'GO',
H:'HINT',HELP:'HINT',PLUG:'USE',FILL:'USE',MELT:'MELT',KILL:'MELT'};
const STOP=/\b(THE|A|AN|AT|TO|WITH|ON|UP|IN|INTO|FROM|OF|AND|MY|SOME|IT)\b/g;
const DIR={N:'N',NORTH:'N',S:'S',SOUTH:'S',E:'E',EAST:'E',W:'W',WEST:'W'};
function run(raw){let s=raw.trim().toUpperCase();if(!s)return;say("> "+s,'you');
if(phase=='dead'){if(s[0]=='Y'||s=='RESTART'){start()}else if(s[0]=='N')say("Thanks for playing!");else if(s=='F')say("Respects paid.",'sys');return}
if(phase=='won'){if(s=='RESTART')start();return}
if(phase!='play')return;
s=s.replace(/\bPICK UP\b/,'GET').replace(/VEGETABLES?|VEGGIES?|\bVEG\b/g,'VEGETABLES').replace(/\bCOINS?\b|MONEY|\bCASH\b/g,'GOLD')
.replace(/MUSHROOMS/,'MUSHROOM').replace(/\bMUTT\b|\bPUPPY\b/g,'DOG').replace(/\bGO TO\b|\bEXIT\b/g,'GO');
s=s.replace(STOP,' ').replace(/\s+/g,' ').trim();let W=s.split(' '),v=W.shift();if(!v)return say("Say what?");
if(DIR[v]){W=[v];v='GO'}v=SYN[v]||v;const o=W.join(' ');
if(pend){const p=pend;pend=null;if(p=='melt'&&(/POD/.test(s)||/THERM/.test(s)))return melt();if(p=='melt'){say("I didn't catch that.");return tick()}}
const meta=cmd(v,o,W);if(meta!==1)tick();if(phase=='play')show(rimg())}
function cmd(v,o,W){const n=k=>W.includes(k),r=S.room,f=S.f;
switch(v){
case'INVENTORY':{const L=S.inv.map(k=>NAME[k]);if(S.gold)L.unshift(S.gold+" gold coins");if(S.bk)L.push(BK[S.bk]);say(L.length?"You are carrying: "+L.join(', ')+".":"You are carrying nothing.");return 1}
case'HINT':hint();return 1;
case'SAVE':try{localStorage.setItem('cavern',JSON.stringify(S));say("Game saved.")}catch(e){say("Saving isn't available here.")}return 1;
case'LOAD':case'RESTORE':try{const d=localStorage.getItem('cavern');if(!d)return say("No saved game found."),1;S=JSON.parse(d);show(rimg());say("Game loaded.");look()}catch(e){say("Couldn't load.")}return 1;
case'SOUND':case'MUSIC':sound=!sound;say("Sound "+(sound?"on.":"off."));return 1;
case'RESTART':start();return 1;
case'QUIT':say("Type RESTART to begin again, or just close this page. Farewell, Andy!");return 1;
case'LOOK':return doLook(o,W,n);
case'GO':return go(o,W);
case'GET':return get(o,n);
case'OPEN':if(r=='bed'&&n('CLOSET'))return doLook('CLOSET OPEN',['CLOSET','OPEN'],k=>k=='CLOSET'||k=='OPEN');
if(r=='bed'&&(n('DOOR')||!o)){say("You open the door and step outside.");enter('out');return}
if(r=='out'&&n('DOOR')){enter('bed');return}say("You can't open that.");return;
case'TALK':return talk(o,n);
case'BUY':return buy(o,n);
case'EAT':
if(n('VEGETABLES')&&has('veg')){drop('veg');S.hu=0;say("Delicious! You feel much better.");mml(SONG.life);return}
if(n('PIE')&&has('pie')){drop('pie');S.hu=0;say("You eat the pie. Yum! (But maybe it had a better use...)");mml(SONG.life);return}
if(n('MUSHROOM')){say("You don't feel well.");return}if(!o)return say("Eat what?");say("You can't eat that, or you don't have it.");return;
case'GIVE':case'THROW':return giveThrow(v,o,n);
case'USE':return use(o,n);
case'FISH':case'CATCH':return use('POLE',k=>k=='POLE');
case'MELT':if(r!='wiz')return say("Melt what? There's nothing here worth melting.");pend='melt';say("What would you like to melt him with?");return;
default:say(["I have no idea what that means.","Huh?","That does not compute."][S.mv%3])}}
function doLook(o,W,n){const r=S.room,f=S.f;
if(!o||n('ROOM')||n('AROUND'))return look(),1;
if(n('GOLD'))return say(S.gold?"You have "+S.gold+" gold coins.":"You have no gold."),1;
const T={bed:{CLOSET:()=>{if(n('OPEN')||true){if(!f.bung){f.bung=1;give('bung');mml(SONG.pick);return"It's a closet. You open it and see a bung. You pick it up."}return"It's a closet. There is nothing else in it."}},
BED:()=>"It's a bed. Your pillow is on top of the bed.",PILLOW:()=>f.feather?"There is nothing of interest here.":"There is a feather here.",DOOR:()=>"It's a door. Maybe you should open it."},
tree:{TREE:()=>"There is a hole in the tree."+(f.bark?"":" A piece of bark is on the ground."),HOLE:()=>{if(!f.coins){f.coins=1;S.gold+=150;mml(SONG.pick);return"You find some gold coins inside! (150 gold)"}return"There's nothing inside."}},
bird:{BIRD:()=>"It's a bird. "+(f.worm?"He looks happy with his new feather.":"He's missing a feather."),PLANT:()=>"The plant has a pod growing on it.",POD:()=>"It's some kind of pod."},
bridge:{BRIDGE:()=>"It's a bridge!",YETI:()=>f.yeti?"The yeti is happily stuffing his face.":"A big, hairy, hungry-looking yeti."},
well:{WELL:()=>"Well, it's a well. Well done."},
market:{MAN:()=>"He is selling vegetables for 50 gold.",WOMAN:()=>"She is selling pies for 100 gold."},
fish:{DOG:()=>"A very loud dog.",FISHERMAN:()=>"A fisherman with a fishing pole."},
dwarf:{DWARF:()=>"An Ice Dwarf, thin and tired.",SWORD:()=>"A fine sword lies near the dwarf."},
forest:{MUSHROOM:()=>"They look... questionable.",BUCKET:()=>"An old bucket. It has a hole in it."}}[r]||{};
for(const k of W)if(T[k]){say(T[k]());return 1}
say("There is nothing of interest here.");return 1}
function go(o,W){const r=S.room,f=S.f;let d=null;for(const k of W)if(DIR[k])d=DIR[k];
if(!d&&(r=='dwarf'||!W.length)||W.some(k=>['CAVERN','CAVE','END'].includes(k))){
 if(r=='dwarf'){if(!f.sleep)return say("The dwarf blocks your way.");return enter('wiz')}}
if(!d&&r=='out'&&W.some(k=>['HOUSE','DOOR','HOME'].includes(k)||!k))return enter('bed');
if(!d&&r=='bed')return say("You open the door and step outside."),enter('out');
if(!d)return say("Which way? Try N, S, E or W.");
if(r=='bed'){say("You'll need to open the door first.");return}
const to=ROOMS[r].x[d];
if(r=='dwarf'&&d=='E'&&f.sleep)return enter('wiz');
if(r=='fish'&&d=='E'&&!f.dogGone)return say("The dog is in your way. That way is blocked.");
if(r=='bridge'&&d=='E'&&!f.yeti)return say("The yeti is blocking you!");
if(r=='tiger'&&d=='E'&&!f.tiger)return say("The tiger is in the way!");
if(r=='out'&&d=='N'&&!to)return;
if(!to)return say("You can't go that way.");
enter(to);if(to=='tiger'&&!f.tiger)say("The tiger crouches... get rid of it, fast!",'bad')}
function get(o,n){const r=S.room,f=S.f;
if(r=='bed'){if(n('BUNG')||n('CLOSET'))return doLook('CLOSET',['CLOSET'],n);
 if(n('FEATHER')){if(f.feather)return say("You already have it.");f.feather=1;give('feather');mml(SONG.pick);return say("You pick up the feather.")}
 if(n('PILLOW'))return say("You don't need the pillow.")}
if(r=='tree'){if(n('BARK')){if(f.bark)return say("You already have it.");f.bark=1;give('bark');mml(SONG.life);return say("You pick up the bark.")}
 if(n('GOLD'))return doLook('HOLE',['HOLE'],n)}
if(r=='bird'&&n('POD')){if(has('pod'))return say("You already have it.");give('pod');mml(SONG.pick);return say("OK. It is warm to the touch.")}
if(r=='forest'){if(n('MUSHROOM')){if(has('mushroom'))return say("You already have one.");f.mush=1;give('mushroom');return say("OK.")}
 if(n('BUCKET')){if(S.bk)return say("You already have it.");S.bk='hole';f.bucket=1;mml(SONG.pick);return say("OK. There is a hole in the bucket.")}}
if(r=='dwarf'&&n('SWORD')){if(has('sword'))return say("You already have it.");if(!f.sleep)return say("The dwarf will not give it to you.");give('sword');return say("OK.")}
if(r=='fish'&&n('POLE'))return say("Maybe the fisherman would give you one if you were nice to him...");
say("You can't get that.")}
function talk(o,n){const r=S.room,f=S.f;
if(r=='bridge'&&n('YETI'))return say("GRRRRRRR.");
if(r=='dwarf'&&(n('DWARF')||n('MAN'))){return say(f.sleep?"Zzzzz...":"I cannot let you in the cavern. Many Ice Dwarves have already died. I am trying to prevent the wizard from leaving. Until I starve to death...")}
if(r=='market'){if(n('MAN'))return say("He is selling vegetables for 50 gold.");if(n('WOMAN'))return say("She is selling pies for 100 gold.")}
if(r=='fish'&&(n('FISHERMAN')||n('MAN'))){if(!f.dogGone)return say("You can't talk to him with that dog in the way.");
 if(!f.pole){f.pole=1;give('pole');mml(SONG.life);return say("Thank you for getting rid of that mangy mutt. The fisherman gives you an extra fishing pole as a thank you.")}
 return say("He nods and goes back to fishing.")}
if(r=='bird'&&n('BIRD'))return say("Tweet!");
say("Nobody answers.")}
function buy(o,n){if(S.room!='market')return say("There's nothing to buy here.");
const b=(k,p,t)=>{if(has(k))return say("You already have some.");if(S.gold<p)return say(p==50?"You don't have the cash.":"You're not rolling in the geedis.");S.gold-=p;give(k);mml(SONG.pick);say(t)};
if(n('VEGETABLES'))return b('veg',50,"You buy some vegetables.");if(n('PIE'))return b('pie',100,"You buy a delicious pie.");say("Buy what? Vegetables (50) or pie (100)?")}
function giveThrow(v,o,n){const r=S.room,f=S.f;
const it=['FEATHER','BARK','PIE','FISH','POD','SWORD','WORM','BUNG','POLE','GOLD'].find(k=>n(k)),poi=n('POISON');
if(poi){if(S.bk!='poison')return say("You don't have any.");if(r!='dwarf')return say("Nobody here wants that.");if(f.sleep)return say("The dwarf is already asleep.");
 f.sleep=1;S.bk='plug';mml(SONG.life);return say("Thanks for the soup! I think I'll take a nap now.")}
if(!it)return say(v=='GIVE'?"Give what?":"Throw what?");
const k=it.toLowerCase(),have=k=='gold'?S.gold>0:has(k);
if(!have)return say(it=='PIE'||it=='FISH'?"You don't have any.":"You don't have it.");
if(it=='FEATHER'&&r=='bird'){drop('feather');give('worm');f.worm=1;mml(SONG.life);return say("You give the feather to the bird. He gives you a worm.")}
if(it=='PIE'&&r=='bridge'){if(f.yeti)return;drop('pie');f.yeti=1;mml(SONG.life);return say("You throw the pie. The yeti catches it and wanders off to eat it. The way east is clear!")}
if(it=='BARK'&&r=='fish'&&!f.dogGone){drop('bark');f.dogGone=1;mml(SONG.life);return say("You throw the bark and the dog leaves. Your bark was worse than his bite.")}
if(it=='FISH'&&r=='tiger'&&!f.tiger){drop('fish');f.tiger=1;mml(SONG.life);return say("The tiger leaves.")}
if(it=='POD'&&r=='wiz'&&v=='THROW')return melt();
if(it=='SWORD'&&r=='wiz')return say("The sword clangs harmlessly off his ice shield. That's not going to work.");
if(v=='THROW'){say("You throw it. Nothing happens, so you pick it back up.");return}
say("Nobody here wants that.")}
function use(o,n){const r=S.room,f=S.f;
if(n('POLE')||o==''&&false){if(!has('pole'))return say("You don't have one.");if(r!='bridge')return say("There's no good place to fish here.");
 if(!has('worm'))return say("You don't have any bait.");if(has('fish'))return say("You already caught one.");
 drop('worm');give('fish');mml(SONG.life);return say("You use the worm and catch a fish!")}
if(n('BUNG')){if(!has('bung'))return say("You don't have one.");if(S.bk=='hole'){S.bk='plug';drop('bung');return say("You plug up the hole in the bucket.")}return say("How do you want to use it?")}
if(n('BUCKET')){if(!S.bk)return say("You don't have one.");if(r!='well')return say("Use it where?");
 if(S.bk=='hole')return say("There is a hole in the bucket.");if(S.bk!='plug')return say("It's already full.");S.bk='water';return say("You fill the bucket.")}
if(n('MUSHROOM')){if(!has('mushroom'))return say("You don't have one.");if(S.bk=='water'){drop('mushroom');S.bk='poison';return say("You put the mushroom in the bucket and it dissolves into a poison.")}return say("How do you want to use it?")}
if(n('POD')&&has('pod')){if(r=='wiz')return melt();return say("Better save it for the right moment.")}
if(!o)return say("Use what?");say(NAME[o.toLowerCase()]||has(o.toLowerCase())?"How do you want to use it?":"You don't have that.")}
function melt(){if(!has('pod'))return say("You don't have one."),tick();win()}
function hint(){const f=S.f,H=[[!f.bung,"Have you looked in the closet in your house?"],[!f.feather,"There's something on the pillow."],[S.room=='bed',"Open the door and head outside."],
[!f.bark||!f.coins,"North of the house is a tree. Look at the tree and its hole."],[!f.worm&&!has('worm')&&!has('fish'),"Give the feather to the bird, west of your house."],[!has('pod')&&!f.podG,"The plant by the bird has a warm pod. Get it."],
[!has('pie')&&!f.yeti,"The market is east. Buy a pie (100 gold) - and vegetables (50) when you're hungry."],[!f.sleep&&S.bk!='poison'&&!f.dogGone&&!f.dog&&false,""],[!f.dogGone,"Throw the bark at the dog in the fisherman's area (east of the market)."],
[!f.pole,"Talk to the fisherman once the dog is gone."],[!f.yeti,"Throw the pie at the yeti on the bridge."],[!has('fish')&&!f.tiger,"Use the pole (with the worm as bait) at the bridge."],[!f.tiger,"Throw the fish at the tiger."],
[!S.bk,"South of your house, get the bucket."],[S.bk=='hole',"Use the bung on the bucket."],[S.bk=='plug',"Use the bucket at the well (south, then east)."],[S.bk=='water'&&!has('mushroom'),"Get a mushroom in the forest."],[S.bk=='water',"Use the mushroom on the bucket of water."],
[!f.sleep,"Give the poison to the dwarf at the cavern entrance."],[true,"Enter the cavern and MELT the wizard with the thermal pod. Don't dawdle!"]];
const h=H.find(x=>x[0]&&x[1]);say("Hint: "+(h?h[1]:"Just follow your instincts."),'sys')}
function tick(){if(phase!='play')return;S.mv++;S.hu++;
if(S.hu==70)say("You are hungry.",'bad');if(S.hu==90)say("You are starving! Eat something soon!",'bad');
if(S.hu>=105)return die("You die of hunger.");
if(S.room=='tiger'&&!S.f.tiger){S.tc++;if(S.tc==3)return die("The tiger pounces. Poor Andy.")}
if(S.room=='wiz'){S.wc++;if(S.wc==4)say("The wizard raises his scepter...",'bad');if(S.wc>=6){say("Your hesitancy has cost you dearly.",'bad');say("The wizard, sensing your apprehension, unleashes a fatal bolt from the ice scepter.",'bad');say("With luck, you will thaw in several million years.",'bad');show('12');phase='dead';setTimeout(()=>{show('CUBE');die("You are frozen solid.",'CUBE')},2600)}}}
// ---- flow ----
function start(){S=fresh();log.innerHTML='';phase='play';pend=null;show('1');say("Type North, South, East or West (or N, S, E, W) to move. Use words like GET, THROW, OPEN, EAT, USE, GIVE, TALK, BUY and LOOK. Press F1 or type I for your inventory. Type HINT if you're stuck.",'sys');look()}
function intro(){if(phase=='intro'){phase='scroll';show('SCROLL');log.innerHTML='';say("Press any key (or tap) to continue.",'sys')}
else if(phase=='scroll'){phase='instr';show('INTRO');say("Instructions: Type North, South, East or West to move. Use words like GET, THROW, OPEN, EAT, USE, or other action words to interact with the world. Press F1 for a list of your inventory. Type QUIT to end the game. Enjoy yourself and try to beat the Evil Wizard.");say("Press any key to continue.",'sys')}
else if(phase=='instr')start()}
show('INTRO');say("Cavern of the Evil Wizard - by MontieMongoose. Web edition. Press any key (or tap) to begin.",'sys');mml(SONG.intro);
document.addEventListener('keydown',e=>{if(e.key=='F1'){e.preventDefault();if(phase=='play')run('I');return}
if(phase=='intro'||phase=='scroll'||phase=='instr'){if(!['Shift','Control','Alt','Meta'].includes(e.key)){e.preventDefault();intro()}return}
if(e.key=='ArrowUp'&&hist.length){hi=Math.max(0,hi-1);inp.value=hist[hi]||'';e.preventDefault()}
if(e.key=='ArrowDown'){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||''}
if(e.key=='Enter'){const v=inp.value;inp.value='';if(v.trim()){hist.push(v);hi=hist.length}run(v)}else if(document.activeElement!=inp&&e.key.length==1&&!e.ctrlKey)inp.focus()});
document.addEventListener('click',e=>{if(phase=='intro'||phase=='scroll'||phase=='instr')intro();else if(e.target.tagName!='BUTTON')inp.focus()});
['N','S','E','W','Look','Inventory','Hint','Save','Load','Sound'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=e=>{e.stopPropagation();if(phase=='play'||phase=='dead')run(t)};$('bt').appendChild(b)});
</script></body></html>
